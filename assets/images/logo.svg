<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="35%" stop-color="#E2B743" />
      <stop offset="70%" stop-color="#BA871F" />
      <stop offset="100%" stop-color="#875F0F" />
    </linearGradient>
    <linearGradient id="goldBright" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="50%" stop-color="#E2B743" />
      <stop offset="100%" stop-color="#BA871F" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Crown on Top -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)">
    <!-- Crown Base -->
    <path d="M 276 34 L 324 34 L 328 39 L 272 39 Z" />
    <!-- Crown Spikes -->
    <path d="M 272 34 L 270 20 L 286 28 L 300 13 L 314 28 L 330 20 L 328 34 Z" />
    <circle cx="270" cy="19" r="2.5" />
    <circle cx="300" cy="12" r="3.2" />
    <circle cx="330" cy="19" r="2.5" />
    <circle cx="286" cy="27" r="2" />
    <circle cx="314" cy="27" r="2" />
  </g>

  <!-- Left Rampant Lion Silhouette -->
  <g fill="url(#goldGrad)" transform="translate(192, 28) scale(0.65)">
    <path d="M 45 42 C 40 35, 42 22, 55 18 C 50 12, 38 10, 32 18 C 28 14, 20 16, 18 24 C 14 28, 12 36, 16 42 C 10 46, 5 55, 8 64 C 12 72, 22 75, 26 82 C 28 86, 26 95, 20 102 C 16 107, 12 110, 8 108 C 4 106, 2 112, 6 116 C 14 122, 26 120, 30 110 C 34 100, 38 90, 42 84 C 48 88, 54 94, 52 104 C 50 114, 42 120, 38 128 C 46 128, 56 122, 60 114 C 64 106, 62 95, 58 88 C 66 82, 70 72, 68 62 C 66 52, 54 48, 45 42 Z" />
    <!-- Forepaws reaching medallion -->
    <path d="M 58 48 C 68 44, 78 40, 86 46 C 88 47, 89 51, 85 52 C 78 54, 70 56, 62 58 Z" />
    <path d="M 56 64 C 66 60, 78 62, 85 68 C 86 70, 84 72, 80 72 C 72 72, 66 70, 58 72 Z" />
  </g>

  <!-- Right Rampant Lion Silhouette (Mirrored) -->
  <g fill="url(#goldGrad)" transform="translate(408, 28) scale(-0.65, 0.65)">
    <path d="M 45 42 C 40 35, 42 22, 55 18 C 50 12, 38 10, 32 18 C 28 14, 20 16, 18 24 C 14 28, 12 36, 16 42 C 10 46, 5 55, 8 64 C 12 72, 22 75, 26 82 C 28 86, 26 95, 20 102 C 16 107, 12 110, 8 108 C 4 106, 2 112, 6 116 C 14 122, 26 120, 30 110 C 34 100, 38 90, 42 84 C 48 88, 54 94, 52 104 C 50 114, 42 120, 38 128 C 46 128, 56 122, 60 114 C 64 106, 62 95, 58 88 C 66 82, 70 72, 68 62 C 66 52, 54 48, 45 42 Z" />
    <!-- Forepaws reaching medallion -->
    <path d="M 58 48 C 68 44, 78 40, 86 46 C 88 47, 89 51, 85 52 C 78 54, 70 56, 62 58 Z" />
    <path d="M 56 64 C 66 60, 78 62, 85 68 C 86 70, 84 72, 80 72 C 72 72, 66 70, 58 72 Z" />
  </g>

  <!-- Center Circular Medallion -->
  <circle cx="300" cy="74" r="39" stroke="url(#goldGrad)" stroke-width="4.5" fill="#0A0B0F" />
  <circle cx="300" cy="74" r="33" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Royal House 'R' Monogram -->
  <g fill="url(#goldGrad)">
    <!-- Left vertical stem of R -->
    <rect x="284" y="55" width="6.5" height="38" rx="1.5" />
    <!-- Upper loop of R -->
    <path d="M 288 55 L 305 55 C 314 55, 319 60, 319 67 C 319 74, 313 79, 304 79 L 288 79 Z M 294.5 60.5 L 294.5 73.5 L 303.5 73.5 C 309 73.5, 312.5 71, 312.5 67 C 312.5 63, 309 60.5, 303.5 60.5 Z" />
    <!-- Right leg transformed into House roof -->
    <path d="M 302 78 L 319 93 L 311 93 L 298 81 Z" />
    <!-- Architectural roof cutout inside R leg -->
    <path d="M 300 85 L 309 77 L 318 85 L 315 85 L 309 80 L 303 85 Z" />
    <!-- 4-Pane Window Inside house icon -->
    <rect x="306" y="87" width="2.5" height="2.5" />
    <rect x="310" y="87" width="2.5" height="2.5" />
    <rect x="306" y="90.5" width="2.5" height="2.5" />
    <rect x="310" y="90.5" width="2.5" height="2.5" />
  </g>

  <!-- Lower Baroque Flourishes below medallion -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 235 125 C 255 120, 275 128, 292 118 C 296 115, 300 114, 304 118 C 321 128, 341 120, 361 125" />
    <path d="M 245 130 C 265 125, 280 134, 296 124 C 298 123, 302 123, 304 124 C 320 134, 335 125, 355 130" />
    <circle cx="230" cy="125" r="3" fill="url(#goldGrad)" stroke="none" />
    <circle cx="366" cy="125" r="3" fill="url(#goldGrad)" stroke="none" />
  </g>

  <!-- Brand Typography -->
  <!-- "RIGHT ASSET'S PROPERTY" -->
  <text x="300" y="165" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="5" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)">
    RIGHT ASSET'S PROPERTY
  </text>

  <!-- Tagline: "YOUR RIGHT CHOICE" -->
  <g>
    <!-- Left underline flourish -->
    <path d="M 120 188 L 225 188" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="118" cy="188" r="2.5" fill="url(#goldGrad)" />
    <!-- Tagline Text -->
    <text x="300" y="193" 
          font-family="'Playfair Display', 'Cinzel', serif" 
          font-size="16" 
          font-weight="600" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="url(#goldBright)">
      “YOUR RIGHT CHOICE”
    </text>
    <!-- Right underline flourish -->
    <path d="M 375 188 L 480 188" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
    <circle cx="482" cy="188" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Core Pillars -->
  <!-- BUY • SELL • INVEST • RENT -->
  <text x="300" y="215" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="4" 
        text-anchor="middle" 
        fill="#E5C467">
    ◆ BUY  ◆ SELL  ◆ INVEST  ◆ RENT
  </text>

  <!-- HOME • OFFICE • SHOP • GODOWN -->
  <text x="300" y="232" 
        font-family="'Plus Jakarta Sans', Arial, sans-serif" 
        font-size="10" 
        font-weight="600" 
        letter-spacing="3.5" 
        text-anchor="middle" 
        fill="#C9A23E" opacity="0.9">
    ◆ HOME  ◆ OFFICE  ◆ SHOP  ◆ GODOWN
  </text>
</svg>
